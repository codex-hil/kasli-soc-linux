image boot.vfat {
    vfat {
        files = { "BOOT.BIN", "u-boot.img", "boot.scr", "top.bit", "zImage", "zc706.dtb", "rootfs.cpio.gz" }
        file extlinux/extlinux.conf { image = "extlinux.conf" }
    }
    size = 64M
}
image sdcard.img {
    hdimage { }
    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
