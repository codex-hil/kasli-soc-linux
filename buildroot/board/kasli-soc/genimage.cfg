image boot.vfat {
    vfat {
        files = { "BOOT.BIN", "zImage", "kasli-soc.dtb" }
        file extlinux/extlinux.conf { image = "extlinux.conf" }
    }
    size = 64M
}
image sdcard.img {
    hdimage { }
    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
